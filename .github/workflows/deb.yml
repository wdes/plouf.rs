name: deb

# Build a .deb on every commit; the artifact is downloadable from the run.
on:
    push:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    deb:
        name: Build .deb
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Install Rust toolchain
              # Latest stable satisfies Mago's rustc >= 1.97 requirement.
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo artifacts
              uses: Swatinem/rust-cache@v2
            - name: Install cargo-deb
              run: cargo install cargo-deb --locked
            - name: Build .deb
              run: |
                  cargo deb
                  # Exact path for the single-file upload below: archive: false
                  # takes ONE concrete file, not a wildcard.
                  echo "DEB_FILE=$(ls target/debian/*.deb)" >> "$GITHUB_ENV"
            - name: Upload .deb
              # A single-file artifact (archive: false): the .deb itself, not a zip
              # wrapping the already-compressed package. The file name becomes the
              # artifact name (the `name` input is ignored under archive: false).
              uses: actions/upload-artifact@v7
              with:
                  path: ${{ env.DEB_FILE }}
                  archive: false
                  retention-days: 30
