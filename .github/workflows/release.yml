name: release

# On a version tag, cross-compile a .deb per Debian arch, extract the raw
# binary from each .deb, and publish everything to a DRAFT GitHub release.
on:
    push:
        tags:
            - 'v*'
    # Manual run to exercise the cross-compile matrix without publishing a
    # release (the release job is gated on a tag ref, so it is skipped here).
    workflow_dispatch:

# contents: create the release + upload assets. id-token + attestations:
# sign SLSA build-provenance attestations for every binary.
permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    reproducible:
        name: Reproducibility check (amd64 .deb)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - name: Install cargo-deb
              run: cargo install cargo-deb --locked
            - name: Build the .deb twice and compare
              # Same commit -> identical bytes. Pin the timestamp, strip build
              # paths, force a fresh compile of our crate between the two builds.
              run: |
                  export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
                  export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=$HOME/.cargo=/cargo"
                  export CARGO_INCREMENTAL=0
                  cargo deb
                  a="$(sha256sum target/debian/*.deb | cut -d' ' -f1)"
                  rm -f target/debian/*.deb
                  cargo clean -p plouf-rs
                  cargo deb
                  b="$(sha256sum target/debian/*.deb | cut -d' ' -f1)"
                  echo "build 1: $a"
                  echo "build 2: $b"
                  if [ "$a" != "$b" ]; then echo '::error::.deb is NOT reproducible'; exit 1; fi
                  echo "reproducible: $a"

    deb:
        name: Build .deb (${{ matrix.deb_arch }})
        runs-on: ubuntu-latest
        strategy:
            # Keep going so one flaky/exotic target does not sink the rest;
            # the release job publishes whatever succeeded.
            fail-fast: false
            matrix:
                # deb_arch -> Rust target (+ cross linker; empty = native amd64).
                include:
                    - deb_arch: amd64
                      target: x86_64-unknown-linux-gnu
                      linker: ''
                    - deb_arch: arm64
                      target: aarch64-unknown-linux-gnu
                      linker: aarch64-linux-gnu-gcc
                    - deb_arch: armhf
                      target: armv7-unknown-linux-gnueabihf
                      linker: arm-linux-gnueabihf-gcc
                    - deb_arch: i386
                      target: i686-unknown-linux-gnu
                      linker: i686-linux-gnu-gcc
                    - deb_arch: ppc64el
                      target: powerpc64le-unknown-linux-gnu
                      linker: powerpc64le-linux-gnu-gcc
                    - deb_arch: s390x
                      target: s390x-unknown-linux-gnu
                      linker: s390x-linux-gnu-gcc
                    - deb_arch: riscv64
                      target: riscv64gc-unknown-linux-gnu
                      linker: riscv64-linux-gnu-gcc
        steps:
            - uses: actions/checkout@v7
            - name: Reproducible build env
              # Pin the timestamp to the commit and strip build paths so the
              # binary + .deb come out byte-for-byte reproducible.
              run: |
                  echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
                  echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=$HOME/.cargo=/cargo" >> "$GITHUB_ENV"
                  echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
            - name: Install Rust toolchain
              # Latest stable satisfies Mago's rustc >= 1.97 requirement.
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - name: Cache cargo artifacts
              uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.target }}
            - name: Install cross toolchain
              # Pulls in the <triple>-gcc cross linker for non-native archs.
              if: ${{ matrix.linker != '' }}
              run: sudo apt-get update && sudo apt-get install -y crossbuild-essential-${{ matrix.deb_arch }}
            - name: Configure cargo linker
              # cargo reads CARGO_TARGET_<TRIPLE>_LINKER (uppercase, - and . -> _).
              if: ${{ matrix.linker != '' }}
              run: |
                  triple=$(echo '${{ matrix.target }}' | tr '[:lower:].-' '[:upper:]__')
                  echo "CARGO_TARGET_${triple}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"
            - name: Install cargo-deb
              run: cargo install cargo-deb --locked
            - name: Build .deb
              # cargo-deb rewrites target/release -> target/<triple>/release for the
              # assets list, so the cross-built binary is packaged correctly.
              run: cargo deb --target ${{ matrix.target }}
            - name: Extract raw binary and stage assets
              # Pull the plain executable out of the .deb so users without apt/dpkg
              # can grab a per-arch-named binary; ship the .deb alongside it.
              run: |
                  mkdir -p dist
                  deb=$(ls target/${{ matrix.target }}/debian/*.deb)
                  dpkg-deb -x "$deb" extracted
                  cp extracted/usr/bin/plouf-rs dist/plouf-rs-${{ matrix.deb_arch }}
                  cp "$deb" dist/
            - name: Upload artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: dist-${{ matrix.deb_arch }}
                  path: dist/*
                  if-no-files-found: error

    musl:
        name: Static musl binary (${{ matrix.arch }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    # x86_64 links against rustc's self-contained musl (no apt).
                    - arch: x86_64
                      target: x86_64-unknown-linux-musl
                      gcc: ''
                      linker: ''
                    - arch: aarch64
                      target: aarch64-unknown-linux-musl
                      gcc: gcc-aarch64-linux-gnu
                      linker: aarch64-linux-gnu-gcc
        steps:
            - uses: actions/checkout@v7
            - name: Reproducible build env
              # Pin the timestamp to the commit and strip build paths so the
              # binary + .deb come out byte-for-byte reproducible.
              run: |
                  echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
                  echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=$HOME/.cargo=/cargo" >> "$GITHUB_ENV"
                  echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - name: Cache cargo artifacts
              uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.target }}
            - name: Install cross linker
              if: ${{ matrix.gcc != '' }}
              run: sudo apt-get update && sudo apt-get install -y ${{ matrix.gcc }}
            - name: Configure cargo linker
              if: ${{ matrix.linker != '' }}
              run: |
                  triple=$(echo '${{ matrix.target }}' | tr '[:lower:].-' '[:upper:]__')
                  echo "CARGO_TARGET_${triple}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"
            - name: Build static binary
              # A fully static musl binary -- runs on any Linux (Alpine, distroless,
              # minimal containers) with no libc dependency.
              run: cargo build --release --target ${{ matrix.target }}
            - name: Stage binary
              run: |
                  mkdir -p dist
                  cp target/${{ matrix.target }}/release/plouf-rs dist/plouf-rs-${{ matrix.arch }}-musl
            - name: Upload artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: dist-musl-${{ matrix.arch }}
                  path: dist/*
                  if-no-files-found: error

    e2e:
        name: e2e (apt install + query the installed binary)
        needs: deb
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7 # for the mock fixtures under tests/fixtures
            - name: Download the amd64 .deb
              uses: actions/download-artifact@v8
              with:
                  name: dist-amd64
                  path: dist
            - name: Install via apt
              run: sudo apt-get install -y ./dist/plouf-rs_*_amd64.deb
            - name: Assert --version matches the crate version
              run: |
                  ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
                  out=$(plouf-rs --version)
                  echo "$out (expected v$ver)"
                  echo "$out" | grep -q "plouf-rs v$ver ("
            - name: Index mock fixtures and assert queries
              run: |
                  plouf-rs index tests/fixtures --out /tmp/g
                  # find a symbol
                  plouf-rs find Company --out /tmp/g | grep -q 'Company.php#Company'
                  # Eloquent relation (Invoice belongsTo Company) + PHPUnit covers
                  callers=$(plouf-rs callers Company --out /tmp/g)
                  echo "$callers" | grep -q '^belongsTo'
                  echo "$callers" | grep -q '^covers'
                  # model <-> table <-> migration join node
                  table=$(plouf-rs callers table:companies --out /tmp/g)
                  echo "$table" | grep -q '^table'
                  echo "$table" | grep -q '^migrates'
                  # translation-key usage
                  plouf-rs uses company.label --out /tmp/g | grep -q 'Company.php'
                  # DB-schema verb
                  plouf-rs tables --schema tests/fixtures/schema.json | grep -q '^companies$'
                  # error path: an unknown symbol exits non-zero
                  if plouf-rs body definitely_absent --out /tmp/g; then
                      echo '::error::expected a non-zero exit for an unknown symbol'
                      exit 1
                  fi
                  echo 'e2e: all assertions passed'

    release:
        name: Publish draft release
        needs: [deb, musl, e2e]
        # Only on a tag push (skipped for a manual workflow_dispatch test run), and
        # even if some archs failed (fail-fast is off) -- but not on cancel.
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v8
              with:
                  path: dist
                  merge-multiple: true
            - name: Attest build provenance
              # Signed SLSA provenance for every .deb + raw binary; verify with
              # `gh attestation verify <file> --repo ${{ github.repository }}`.
              uses: actions/attest-build-provenance@v4
              with:
                  subject-path: 'dist/*'
            - name: Create or refresh draft release
              # Collect only files (skip any directories) so the glob never feeds
              # a dir to gh. Idempotent: create on first run, upload+clobber after.
              # A SemVer pre-release tag (a `-` suffix: v1.2.3-pre / -rc.1 / ...)
              # is marked as a GitHub pre-release.
              run: |
                  mapfile -t assets < <(find dist -type f)
                  prerelease=()
                  case "${{ github.ref_name }}" in *-*) prerelease=(--prerelease) ;; esac
                  gh release create "${{ github.ref_name }}" \
                      --draft \
                      "${prerelease[@]}" \
                      --generate-notes \
                      --title "${{ github.ref_name }}" \
                      --repo "${{ github.repository }}" \
                      "${assets[@]}" \
                  || {
                      gh release upload "${{ github.ref_name }}" \
                          --clobber \
                          --repo "${{ github.repository }}" \
                          "${assets[@]}"
                      if [ ${#prerelease[@]} -gt 0 ]; then
                          gh release edit "${{ github.ref_name }}" \
                              --repo "${{ github.repository }}" --prerelease
                      fi
                  }
